[workspace]
members = [
    "crates/orc-core",
    "crates/orc-cli",
    "crates/orc-tui",
    "crates/orc-proto",
    "crates/orc-pty",
    "crates/orc-daemon",
    "crates/orc-app",
    "crates/orc-mcp",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.103"
backon = { version = "1.6.0", default-features = false, features = ["std", "std-blocking-sleep"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2"
notify = "8.2.0"
ratatui = "0.30.2"
# MCP (stdio) server surface lives only in orc-mcp; the official Rust SDK.
# Kept feature-minimal so tokio never leaks into orc-core/orc-daemon (issue #8,
# per the #16 crate decision record). schemars unifies with the workspace pin.
rmcp = { version = "2.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
signal-hook = "0.3.18"
portable-pty = "0.9.0"
shell-words = "1.1.0"
tachyonfx = { version = "0.25.1", features = ["std-duration"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
unicode-width = "0.2.2"
ureq = { version = "3.3.0", features = ["json"] }
vt100 = "0.16.2"

[workspace.lints.rust]
unsafe_code = "deny"
